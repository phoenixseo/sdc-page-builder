name: CI

# Runs on every push and pull request into the release branches. The job matrix
# is the claim in readme.txt: PHP 7.4 (the minimum) and 8.3 (current), each
# with lint, PHPCS and the PHPUnit suite against the real WordPress test
# library.
#
# What this does NOT cover: the ACF/SCF host plugin is not on wp.org for SCF, so
# the SCF flavour of the suite runs locally only (SDC_TEST_HOST_PLUGIN=scf).
# The matrix here runs the ACF flavour, which is the one a reviewer installs.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SDC_TEST_DB_HOST: 127.0.0.1:3306
      SDC_TEST_DB_NAME: wp_tests
      SDC_TEST_DB_USER: root
      SDC_TEST_DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, mysqli, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: plugin
        # Platform PHP is pinned to the minimum in composer.json, so the lock
        # file resolves identically on both matrix entries.
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        working-directory: plugin
        # Only the plugins own files: vendor/ and the roots/wordpress checkout
        # are not ours to lint, and linting them hides a real syntax error in
        # 1300 lines of "No syntax errors detected".
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './wordpress/*' \
            -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "syntax OK"

      - name: PHPCS (WordPress Coding Standards)
        working-directory: plugin
        run: vendor/bin/phpcs -q

      - name: PHPUnit
        working-directory: plugin
        # roots/wordpress installs a core checkout into plugin/wordpress/ — the
        # bootstrap needs it, because the test library boots a real WordPress
        # and the plugin is symlinked into its wp-content/plugins.
        #
        # The bootstrap needs ACF, which is not vendored. Fetching it from
        # wp.org keeps the CI run honest: it tests against the plugin a user
        # actually installs, at the version the local suite uses.
        env:
          SDC_TEST_HOST_PLUGIN: acf
          SDC_TEST_WP_DIR: ${{ github.workspace }}/plugin/wordpress
        run: |
          mkdir -p /tmp/acf-free
          curl -fsSL -o /tmp/acf.zip https://downloads.wordpress.org/plugin/advanced-custom-fields.6.8.10.zip
          unzip -q /tmp/acf.zip -d /tmp/acf-free
          export SDC_TEST_ACF_ZIP=/tmp/acf-free/advanced-custom-fields
          vendor/bin/phpunit

  # readme.txt and the plugin header both promise "Requires at least: 6.4".
  # A promise nothing runs on is a guess: WordPress removes and deprecates APIs
  # between majors, so this job boots the *declared minimum* core and runs the
  # same suite there. The version is read from the header, never typed here —
  # raising the minimum moves this job with it instead of leaving a stale job
  # that keeps passing against a version the plugin no longer supports.
  min-wp:
    name: Declared minimum WordPress
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wp_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SDC_TEST_DB_HOST: 127.0.0.1:3306
      SDC_TEST_DB_NAME: wp_tests
      SDC_TEST_DB_USER: root
      SDC_TEST_DB_PASSWORD: root
      SDC_TEST_HOST_PLUGIN: acf

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The minimum PHP too: the minimum core is the entry point a reviewer
          # on an old host reaches for, and that host also runs an old PHP.
          php-version: '7.4'
          extensions: mbstring, intl, mysqli, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        working-directory: plugin
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Stage the minimum core and its test library
        id: core
        run: |
          set -euo pipefail
          MIN="$(sed -n 's/^ \* Requires at least: *//p' plugin/sdc-page-builder.php | head -1)"
          if [ -z "$MIN" ]; then
            echo "No 'Requires at least' in the plugin header." >&2
            exit 1
          fi
          echo "header declares: $MIN"

          # A separate vendor tree, so the current core the other job uses is
          # untouched. The installer plugin must be allowed up front: an
          # interactive prompt in CI fails the job with a message about
          # plugins rather than about WordPress.
          mkdir -p /tmp/wpmin
          cat > /tmp/wpmin/composer.json <<JSON
          {
            "config": {
              "allow-plugins": { "roots/wordpress-core-installer": true },
              "platform": { "php": "7.4.33" }
            }
          }
          JSON
          composer require --dev --no-interaction --no-progress --working-dir=/tmp/wpmin \
            "roots/wordpress:${MIN}.*" "wp-phpunit/wp-phpunit:${MIN}.*"

          CORE="$(sed -n "s/^\$wp_version = '\(.*\)';/\1/p" /tmp/wpmin/wordpress/wp-includes/version.php)"
          if [ -z "$CORE" ]; then
            echo "No core staged in /tmp/wpmin/wordpress." >&2
            exit 1
          fi
          echo "staged core: $CORE"
          echo "core=$CORE" >> "$GITHUB_OUTPUT"

      - name: PHPUnit on the minimum core
        working-directory: plugin
        # HarnessTest reads the same header and fails the suite if the booted
        # core is older than the promise, so a fallback to another core cannot
        # pass silently.
        env:
          SDC_TEST_WP_DIR: /tmp/wpmin/wordpress
          WP_TESTS_DIR: /tmp/wpmin/vendor/wp-phpunit/wp-phpunit
        run: |
          echo "core under test: ${{ steps.core.outputs.core }}"
          mkdir -p /tmp/acf-free
          curl -fsSL -o /tmp/acf.zip https://downloads.wordpress.org/plugin/advanced-custom-fields.6.8.10.zip
          unzip -q /tmp/acf.zip -d /tmp/acf-free
          export SDC_TEST_ACF_ZIP=/tmp/acf-free/advanced-custom-fields
          vendor/bin/phpunit

  js:
    name: JS (inspector rows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The editor scripts ship as written — no bundler, no npm install. The
      # row logic lives in assets/inspector-rows.js precisely so it runs here:
      # a row that loses acf_fc_layout renders empty on the server and
      # disappears, which no PHP test can see.
      - name: Syntax check editor scripts
        run: |
          node --check plugin/assets/block.js
          node --check plugin/assets/inspector-rows.js
          node --check plugin/assets/admin-tabs.js
          node --check plugin/assets/field-editor.js
          node --check plugin/assets/media-field.js

      - name: Row operation suite
        run: node --test plugin/tests/js/

  readme:
    name: readme.txt structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check readme.txt
        run: bash test-scf/check-readme.sh
